buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}
apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // FTCodeSim runs as a JVM unit test (see src/test/java/SimulateRobot.java)
    testOptions {
        unitTests.all {
            outputs.upToDateWhen { false }
            testLogging {
                showStandardStreams = true
            }
        }
    }
}

repositories {
    maven {
        url 'https://repo.dairy.foundation/releases'
    }
    maven {
        url 'https://maven.anygeneric.dev/'
    }
    maven {
        url 'https://www.jitpack.io'
    }
    maven {
        url 'https://repo.dairy.foundation/snapshots'
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'dev.nextftc.v2:control:0.3.0'
    implementation 'dev.nextftc.v2:hardware:0.3.0'
    implementation 'dev.nextftc.v2:robot:0.3.0'
    implementation("gay.zharel.fateweaver:ftc:0.4.1")
    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")
    implementation 'com.skeletonarmyftc.marrow:core:1.2.4'
    implementation 'dev.anygeneric:blazeftc:0.1.67'
    implementation "dev.anygeneric:blazeftc_pedro3:0.1.67"

    // FTCodeSim - simulate the robot in AdvantageScope (test only, never shipped to the robot)
    testImplementation("org.codeblooded.ftcodesim:ftcodesim:0.2.1-beta")
    testImplementation("junit:junit:4.13.2")
    testImplementation("com.fasterxml.jackson.core:jackson-databind:2.22.3") // edits the AdvantageScope layout

}